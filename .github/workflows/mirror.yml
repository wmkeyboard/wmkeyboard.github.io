name: Mirror

# Builds the docs site from the public wasi-master/wmkeyboard repository and
# publishes it here, as a mirror of https://wmkeyboard.pages.dev for networks
# that block *.pages.dev.
#
# The build is the same one Cloudflare runs. SITE_URL stays pages.dev, so the
# canonical links, og: URLs and sitemap on this mirror point back at the
# primary host and search engines index one copy, not two.
#
# Nothing pushes to this repository. It rebuilds once a day from the source's
# main branch; the daily run always builds, which also picks up the addon seed
# repositories the addon pages fetch at build time. A manual run without
# "force" builds only if the source trees the site is built from (docs/ and the
# app assets it imports) changed since the deployed build, recorded in
# /mirror.json.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if the source is unchanged'
        type: boolean
        default: false

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SOURCE: wasi-master/wmkeyboard

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.diff.outputs.build }}
      stamp: ${{ steps.diff.outputs.stamp }}
    steps:
      # GitHub disables a scheduled workflow after 60 days without a commit to
      # the repository, and deploys are not commits. Re-enabling it resets
      # that clock.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/mirror.yml/enable"

      - id: diff
        env:
          FORCE: ${{ github.event_name == 'schedule' || inputs.force }}
        run: |
          git clone -q --filter=blob:none --depth 1 --no-checkout "https://github.com/$SOURCE.git" src
          cd src
          stamp="$(git rev-parse HEAD:docs) $(git rev-parse HEAD:app/src/main/assets)"
          deployed=$(curl -fsS https://wmkeyboard.github.io/mirror.json 2>/dev/null | jq -r '.stamp // empty' || true)
          echo "source:   $stamp"
          echo "deployed: $deployed"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
          if [ "$FORCE" = "true" ] || [ "$stamp" != "$deployed" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history: the sitemap's <lastmod> is each page's git date.
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE }}
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Build
        working-directory: docs
        env:
          STAMP: ${{ needs.check.outputs.stamp }}
        run: |
          npm ci
          npm run build
          # Cloudflare-only; GitHub Pages ignores it.
          rm -f dist/_headers
          # Search Console ownership of this host. Mirror-only, so it lives here
          # and not in the source; Google reads it from the home page.
          sed -i 's|<head>|<head><meta name="google-site-verification" content="GgdbCyS9Mh5u8-kotL0oVkY3nDYeJ3rAjUuEad-SRE0">|' dist/index.html
          grep -q google-site-verification dist/index.html
          jq -n --arg stamp "$STAMP" --arg commit "$(git rev-parse HEAD)" \
            --arg built "$(date -u +%FT%TZ)" '{stamp: $stamp, commit: $commit, built: $built}' > dist/mirror.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
